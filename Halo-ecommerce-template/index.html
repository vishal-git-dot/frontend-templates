<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halo: light for the rooms you live in</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#070611;--fg:#f1eeff;--muted:#a8a2c6;--line:rgba(255,255,255,.14);--glass:rgba(16,13,34,.66);--acc:#9a7cff;--acc2:#38d5ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070611}}
:root[data-theme="dark"]{--bg:#070611}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
header,main,footer,.drawer{position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:24px;padding:14px clamp(16px,5vw,64px);background:rgba(7,6,17,.55);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.35rem;letter-spacing:-.03em;margin-right:auto}
header nav{display:flex;gap:22px;align-items:center;color:var(--muted)}
header nav a:hover,header nav button:hover{color:var(--fg)}
nav button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(16px,5vw,48px)}
.hero{min-height:78vh;display:flex;align-items:center}
h1{font-size:clamp(2.7rem,8.5vw,6rem);line-height:.96;letter-spacing:-.035em;font-weight:800;margin:0 0 22px;max-width:13ch}
h2{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.06;letter-spacing:-.025em;font-weight:800;margin:0 0 12px}
.lead{font-size:clamp(1.05rem,2.2vw,1.22rem);color:var(--muted);max-width:46ch;margin:0 0 30px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font:600 1rem inherit;font-family:inherit;border:1px solid var(--line);color:var(--fg);background:transparent;cursor:pointer}
.btn.main{background:var(--fg);color:#150f33;border-color:var(--fg)}
.btn+.btn{margin-left:10px}
:is(a,button,input,select):focus-visible{outline:2px solid #fff;outline-offset:3px}
section{padding:clamp(40px,7vw,88px) 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{display:block}
.tile{aspect-ratio:4/5;border-radius:18px;border:1px solid var(--line);position:relative;overflow:hidden;
background:radial-gradient(circle at 50% 38%,hsl(var(--h) 95% 70%/.95) 0,hsl(var(--h) 70% 38%) 22%,hsl(var(--h) 55% 14%) 52%,#0b0a18 80%)}
.tile::after{content:"";position:absolute;left:50%;bottom:14%;width:34%;height:3px;background:hsl(var(--h) 90% 80%/.5);transform:translateX(-50%);border-radius:3px;box-shadow:0 0 24px 6px hsl(var(--h) 95% 65%/.4)}
.card .tile{transition:transform .35s,box-shadow .35s}
.card:hover .tile{transform:translateY(-4px);box-shadow:0 18px 50px -12px hsl(var(--h) 90% 60%/.45)}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-weight:600}
.card small{color:var(--muted)}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1.5fr;gap:8px 40px;padding:24px 0;border-bottom:1px solid var(--line)}
.row h3{margin:0;font-size:1.2rem}.row p{margin:0;color:var(--muted);max-width:50ch}
.banner{border:1px solid var(--line);border-radius:24px;padding:clamp(28px,6vw,64px);background:var(--glass);backdrop-filter:blur(10px)}
footer{border-top:1px solid var(--line);padding:28px clamp(16px,5vw,64px);color:var(--muted);font-size:.92rem;display:flex;flex-wrap:wrap;gap:12px 28px;background:rgba(7,6,17,.6)}
.panel{max-width:440px;margin:clamp(24px,8vh,90px) auto;padding:30px;border:1px solid var(--line);border-radius:22px;background:var(--glass);backdrop-filter:blur(14px)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem inherit;font-family:inherit;padding:9px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:#150f33}
label.f{display:block;margin-bottom:16px;color:var(--muted);font-size:.9rem}
input,select{width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);font:inherit}
select option{color:#111}
.panel .btn{width:100%;margin-top:6px}
.note{color:var(--muted);font-size:.85rem;text-align:center;margin-top:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px}
.bar select{width:auto;margin:0 0 0 auto}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:#150f33;border-color:var(--fg)}
.pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);padding:36px 0 20px}
.pd .tile{aspect-ratio:1/1.05}
.price{font-size:1.6rem;font-weight:600;margin:6px 0 18px}
.sw{display:inline-flex;gap:10px;margin:8px 0 22px}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:#fff}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;margin-right:12px}
.qty button{width:40px;height:44px;background:none;border:0;color:var(--fg);font-size:1.2rem;cursor:pointer}
.qty span{min-width:28px;text-align:center}
.back{color:var(--muted)}.back:hover{color:var(--fg)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:rgba(10,8,24,.96);border-left:1px solid var(--line);padding:24px;transform:translateX(100%);transition:transform .3s;z-index:20;overflow:auto;backdrop-filter:blur(16px)}
.drawer.open{transform:none}
.li{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--fg);color:#150f33;padding:12px 20px;border-radius:999px;font-weight:600;transition:.3s;z-index:30;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (max-width:760px){.pd,.row{grid-template-columns:1fr}header nav{gap:14px}.btn+.btn{margin:10px 0 0}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<header>
  <a class="logo" href="#/">Halo</a>
  <nav aria-label="Main"><a href="#/explore">Explore</a><a href="#/login" id="acct">Sign in</a><button id="cartbtn" type="button">Cart (<span id="cc">0</span>)</button></nav>
</header>
<main id="app" tabindex="-1"></main>
<footer><span>Halo</span><a href="#/explore">Shop all</a><a href="#/login">Account</a><span>Frontend template, no backend. Cart and sign-in are demo only.</span></footer>
<aside class="drawer" id="drawer" aria-label="Cart"><div class="head"><h2 style="font-size:1.5rem;margin:0">Your cart</h2><button class="chip" id="closecart" type="button">Close</button></div><div id="items"></div></aside>
<div class="toast" id="toast" role="status"></div>

<script>
var P=[
{id:1,n:"Arc desk lamp",c:"Lamps",p:128,h:268,d:"A slim aluminium arm with a dimmable warm-to-cool LED head. Pivots a full 300 degrees."},
{id:2,n:"Ember table lamp",c:"Lamps",p:164,h:18,d:"Hand-blown opal glass on a walnut base. Casts a soft pool of amber light."},
{id:3,n:"Drift floor lamp",c:"Lamps",p:249,h:196,d:"A tall, quiet column of diffused light with a touch dimmer in the stem."},
{id:4,n:"Dusk candle",c:"Candles",p:34,h:310,d:"Soy wax, cedar and fig. Burns clean for roughly 55 hours."},
{id:5,n:"Tide candle",c:"Candles",p:34,h:172,d:"Sea salt and driftwood in a reusable ceramic vessel."},
{id:6,n:"Prism tray",c:"Objects",p:58,h:222,d:"A pressed-glass catch-all that splits window light into colour on your shelf."},
{id:7,n:"Orbit pendant",c:"Lamps",p:189,h:48,d:"A matte globe pendant with a three-metre braided cord and ceiling canopy."},
{id:8,n:"Halo mirror",c:"Objects",p:142,h:285,d:"A round mirror rimmed with a concealed LED ring for gentle edge lighting."}];
var cart=[],cat="All",sort="feat",user=null,calmT=0;
var $=function(s){return document.querySelector(s)};
var app=$("#app");
var card=function(p){return '<a class="card" href="#/product/'+p.id+'"><div class="tile" style="--h:'+p.h+'"></div><div class="meta"><span>'+p.n+'</span><span>$'+p.p+'</span></div><small>'+p.c+'</small></a>'};
var V={
home:function(){calmT=0;return '<div class="wrap"><div class="hero"><div><h1>Light for the rooms you live in.</h1><p class="lead">Lamps, candles and objects designed to make an evening feel slower. Free shipping over $75.</p><a class="btn main" href="#/explore">Shop the collection</a><a class="btn" href="#/login">Create account</a></div></div>'+
'<section><div class="head"><h2>New this season</h2><a class="back" href="#/explore">View all</a></div><div class="grid">'+P.slice(0,4).map(card).join("")+'</div></section>'+
'<section><div class="rows"><div class="row"><h3>Made to be dimmed</h3><p>Every lamp ships with a smooth dimmer and a warm default, so the room never feels harsh.</p></div><div class="row"><h3>Thirty-day returns</h3><p>Live with it for a month. If the light is not right for your space, send it back.</p></div><div class="row"><h3>Repairable by design</h3><p>Bulbs, switches and cords are replaceable, and we stock the parts for years.</p></div></div></section>'+
'<section><div class="banner"><h2>Get 10% off your first order.</h2><p class="lead">Create an account and the code is applied at checkout.</p><a class="btn main" href="#/login">Sign up</a></div></section></div>'},
login:function(){calmT=.75;return '<div class="panel"><div class="tabs" role="tablist"><button role="tab" id="t-in" aria-selected="true" type="button">Sign in</button><button role="tab" id="t-up" aria-selected="false" type="button">Create account</button></div>'+
'<form id="af"><label class="f" id="nm" hidden>Name<input name="name" autocomplete="name"></label><label class="f">Email<input type="email" name="email" required autocomplete="email"></label><label class="f">Password<input type="password" name="pw" required minlength="6" autocomplete="current-password"></label><button class="btn main" type="submit" id="sub">Sign in</button></form><p class="note">Demo only. Nothing is sent anywhere.</p></div>'},
explore:function(){calmT=.7;var l=P.filter(function(p){return cat=="All"||p.c==cat});
if(sort=="lo")l.sort(function(a,b){return a.p-b.p});if(sort=="hi")l.sort(function(a,b){return b.p-a.p});
return '<div class="wrap"><section><h2>Explore</h2><p class="lead" style="margin-bottom:22px">'+l.length+' products</p><div class="bar">'+["All","Lamps","Candles","Objects"].map(function(c){return '<button class="chip" data-cat="'+c+'" aria-pressed="'+(c==cat)+'">'+c+'</button>'}).join("")+'<select id="sort" aria-label="Sort"><option value="feat"'+(sort=="feat"?" selected":"")+'>Featured</option><option value="lo"'+(sort=="lo"?" selected":"")+'>Price: low to high</option><option value="hi"'+(sort=="hi"?" selected":"")+'>Price: high to low</option></select></div><div class="grid">'+l.map(card).join("")+'</div></section></div>'},
product:function(id){var p=P.filter(function(x){return x.id==id})[0];if(!p)return V.explore();calmT=.6;
var rel=P.filter(function(x){return x.c==p.c&&x.id!=p.id}).concat(P.filter(function(x){return x.c!=p.c&&x.id!=p.id})).slice(0,4);
return '<div class="wrap"><div style="padding-top:26px"><a class="back" href="#/explore">&larr; All products</a></div><div class="pd"><div class="tile" id="pt" style="--h:'+p.h+'"></div><div><small style="color:var(--muted)">'+p.c+'</small><h2 style="margin-top:4px">'+p.n+'</h2><div class="price">$'+p.p+'</div><p class="lead" style="margin-bottom:18px">'+p.d+'</p>'+
'<div>Colour</div><div class="sw" id="sw">'+[0,40,-40].map(function(o,i){var h=(p.h+o+360)%360;return '<button type="button" aria-label="Colour '+(i+1)+'" aria-pressed="'+(i==0)+'" data-h="'+h+'" style="background:hsl('+h+' 85% 60%)"></button>'}).join("")+'</div>'+
'<div style="display:flex;flex-wrap:wrap;gap:12px"><div class="qty"><button type="button" id="dn" aria-label="Fewer">&minus;</button><span id="q">1</span><button type="button" id="up" aria-label="More">+</button></div><button class="btn main" type="button" id="add" data-id="'+p.id+'">Add to cart</button></div>'+
'<div class="rows" style="margin-top:34px"><div class="row" style="grid-template-columns:1fr 2fr;padding:16px 0"><strong>Shipping</strong><span style="color:var(--muted)">Free over $75, delivered in 3 to 5 days.</span></div><div class="row" style="grid-template-columns:1fr 2fr;padding:16px 0"><strong>Returns</strong><span style="color:var(--muted)">30 days, no questions.</span></div></div></div></div>'+
'<section><div class="head"><h2>You may also like</h2></div><div class="grid">'+rel.map(card).join("")+'</div></section></div>'}
};
function route(){var h=(location.hash||"#/").slice(2).split("/"),r=h[0]||"home",v=V[r]?r:"home";
app.innerHTML=V[v](h[1]);window.scrollTo(0,0);$("#drawer").classList.remove("open");
document.title=(v=="home"?"Halo: light for the rooms you live in":"Halo | "+(v=="login"?"Account":v=="explore"?"Explore":"Product"));
bind(v)}
function toast(t){var e=$("#toast");e.textContent=t;e.className="toast on";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className="toast"},2200)}
function drawCart(){var n=0,tot=0,html=cart.map(function(i,k){var p=P[i.id-1];n+=i.q;tot+=p.p*i.q;return '<div class="li"><span>'+p.n+' x '+i.q+'</span><span>$'+p.p*i.q+' <button class="chip" data-rm="'+k+'" type="button" aria-label="Remove '+p.n+'">Remove</button></span></div>'}).join("");
$("#cc").textContent=n;$("#items").innerHTML=cart.length?html+'<div class="li"><strong>Total</strong><strong>$'+tot+'</strong></div><button class="btn main" style="width:100%;margin-top:18px" type="button" id="co">Checkout (demo)</button>':'<p style="color:var(--muted)">Your cart is empty.</p>'}
function bind(v){
if(v=="login"){var up=false,s=function(u){up=u;$("#t-in").setAttribute("aria-selected",!u);$("#t-up").setAttribute("aria-selected",u);$("#nm").hidden=!u;$("#sub").textContent=u?"Create account":"Sign in"};
$("#t-in").onclick=function(){s(false)};$("#t-up").onclick=function(){s(true)};
$("#af").onsubmit=function(e){e.preventDefault();user=new FormData(e.target).get("email");$("#acct").textContent="Account";toast(up?"Account created (demo)":"Signed in (demo)");location.hash="#/explore"}}
if(v=="explore"){document.querySelectorAll("[data-cat]").forEach(function(b){b.onclick=function(){cat=b.dataset.cat;app.innerHTML=V.explore();bind("explore")}});
$("#sort").onchange=function(e){sort=e.target.value;app.innerHTML=V.explore();bind("explore");$("#sort").focus()}}
if(v=="product"){var q=1,pid=$("#add").dataset.id,col=0;
$("#up").onclick=function(){q=Math.min(9,q+1);$("#q").textContent=q};$("#dn").onclick=function(){q=Math.max(1,q-1);$("#q").textContent=q};
document.querySelectorAll("#sw button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#sw button").forEach(function(o){o.setAttribute("aria-pressed","false")});b.setAttribute("aria-pressed","true");$("#pt").style.setProperty("--h",b.dataset.h)}});
$("#add").onclick=function(){var f=cart.filter(function(i){return i.id==pid})[0];if(f)f.q+=q;else cart.push({id:+pid,q:q});drawCart();toast("Added to cart")}}}
document.addEventListener("click",function(e){var r=e.target.closest("[data-rm]");if(r){cart.splice(+r.dataset.rm,1);drawCart()}if(e.target.id=="co"){toast("Demo checkout, no payment taken")}});
$("#cartbtn").onclick=function(){$("#drawer").classList.add("open")};$("#closecart").onclick=function(){$("#drawer").classList.remove("open")};
window.addEventListener("hashchange",route);drawCart();route();

/* Glow Threads background */
(function(){var cv=$("#gl"),gl=cv.getContext("webgl",{antialias:false,alpha:true,premultipliedAlpha:true});if(!gl)return;
var VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
var FS=["precision mediump float;","uniform vec2 uRes;uniform float uT;uniform float uCalm;",
"void main(){vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;float x=uv.x;vec3 col=vec3(0.);vec3 A=vec3(.6,.49,1.);vec3 B=vec3(.22,.84,1.);",
"for(int b=0;b<3;b++){float fb=float(b);float baseY=(fb-1.)*.28+.05;",
"for(int i=0;i<14;i++){float fi=float(i)/13.;float fan=smoothstep(-1.1,1.1,x+.15*fb);",
"float spread=(fi-.5)*(.03+.55*fan*(1.-.5*uCalm));float breathe=1.+.28*sin(uT*.6+fb*2.+fi*3.);float amp=.22*(1.-.45*uCalm);",
"float y=baseY+amp*sin(x*1.6+uT*.35+fb*2.1)+.5*amp*sin(x*3.1-uT*.25+fb)+spread*breathe;float d=abs(uv.y-y);",
"float g=exp(-d*260.)*.55+.0035/(d+.012);float pulse=.65+.35*sin(uT*.8+fi*6.+fb*1.7+x*2.);col+=mix(A,B,fi)*g*pulse*.16;}}",
"col*=(1.-.62*uCalm);col*=smoothstep(1.4,.2,length(uv*vec2(.8,1.1)));col=1.-exp(-col*1.5);gl_FragColor=vec4(col,max(col.r,max(col.g,col.b)));}"].join("\n");
function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var l=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
var uR=gl.getUniformLocation(pr,"uRes"),uT=gl.getUniformLocation(pr,"uT"),uC=gl.getUniformLocation(pr,"uCalm");
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,t=0,calm=0,last=performance.now();
function f(now){var dt=Math.min((now-last)/1000,.05);last=now;calm+=(calmT-calm)*.05;if(!reduce)t+=dt*(1-.5*calm);
var d=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,cv.clientWidth*d|0),h=Math.max(1,cv.clientHeight*d|0);
if(cv.width!=w||cv.height!=h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}
gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform2f(uR,w,h);gl.uniform1f(uT,t+8);gl.uniform1f(uC,calm);gl.drawArrays(gl.TRIANGLES,0,3);
if(!document.hidden)requestAnimationFrame(f);}
document.addEventListener("visibilitychange",function(){if(!document.hidden){last=performance.now();requestAnimationFrame(f)}});
requestAnimationFrame(f)})();
</script>
</body>
</html>
